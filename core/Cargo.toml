[package]
name = "jupynvim-core"
version = "0.4.1"
edition = "2021"
description = "Native backend for jupynvim — Jupyter notebooks in Neovim with VSCode-style UX"

[[bin]]
name = "jupynvim-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "signal", "fs"] }
tokio-stream = "0.1"
futures = "0.3"

# ZMQ — pure-rust impl, no libzmq C dep
zeromq = { version = "0.4", default-features = false, features = ["tokio-runtime", "all-transport"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }

# Crypto for Jupyter HMAC signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# IDs & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors & logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Filesystem
dirs = "5"

# Misc
bytes = "1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
base64 = "0.22"

# Pseudo-terminal allocation (Phase 3: remote terminals). Lets the spawned
# shell behave like a real terminal — colors, line editing, $TERM etc. —
# rather than line-buffered piped stdio.
portable-pty = "0.8"

# Search (Phase 4). Same crates that power ripgrep: `ignore` for the
# .gitignore-aware directory walker, `regex` for the matching engine.
ignore = "0.4"
regex = "1"

# Filesystem watching (Phase 5). Cross-platform: FSEvent on macOS,
# inotify on Linux, kqueue on BSD. Notifies client via fs_event for
# auto-refresh in the file browser and external-change detection.
notify = "6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
