name: release

# Build prebuilt jupynvim-core binaries for every tag push.
# The lua/jupynvim/install.lua module downloads these so users don't
# need a Rust toolchain locally.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Static musl, so it runs on any x86_64 Linux. A glibc build made
          # on the current Ubuntu needs a glibc that new, which rules out
          # most servers and HPC login nodes. It is published under the
          # -gnu name as well, which is what installers before this looked
          # for, so they get a binary that runs too.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # x86_64-apple-darwin omitted: macos-13 runners queue slowly on
          # free tier and Intel mac users fall back to cargo build via
          # install.lua. Re-add if demand arises.
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: build
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}

      - name: stage artifact
        run: |
          mkdir -p dist
          cp core/target/${{ matrix.target }}/release/jupynvim-core dist/jupynvim-core-${{ matrix.target }}
          strip dist/jupynvim-core-${{ matrix.target }} || true
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cp dist/jupynvim-core-x86_64-unknown-linux-musl dist/jupynvim-core-x86_64-unknown-linux-gnu
          fi
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: jupynvim-core-${{ matrix.target }}
          path: dist/jupynvim-core-*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list artifacts
        run: ls -lah artifacts/

      - name: generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum jupynvim-core-* > SHA256SUMS
          cat SHA256SUMS

      # A tag with a suffix, like v0.4.6-beta.1, is a pre-release, so GitHub
      # keeps pointing "latest" at the last stable one.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
